<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg-blush-1: #F8EAE1; --bg-blush-2: #FCF4EE;
      --ink-900: #221A14; --ink-700: #55483D; --ink-400: #9C8D80;
      --gold-500: #C9A876; --gold-600: #AD8A5C; --gold-100: #F1E3D0;
      --border: #E7D9C9; --white: #FFFFFF; --panel-black: #15110D;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', sans-serif; color: var(--ink-900); }
    h1, h2, h3 { font-family: 'Bodoni Moda', Georgia, 'Times New Roman', serif; margin: 0; font-weight: 500; }
    a { color: var(--gold-600); text-decoration: none; }
    .btn-gold { transition: background .15s ease; }
    .btn-gold:hover { background: var(--gold-600) !important; }
    .app-btn:hover { border-color: var(--gold-500) !important; }
  </style>
</helmet>

<div style="width:1440px; height:900px; background:radial-gradient(circle at 50% 32%, #2a221a 0%, var(--panel-black) 60%, #0a0806 100%); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; font-family:'Manrope',sans-serif;">

  <div style="position:absolute; inset:0; background-image: radial-gradient(rgba(201,168,118,0.14) 1px, transparent 1.5px); background-size: 20px 20px;"></div>

  <div style="position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-align:center; max-width:520px;">

    <div style="width:96px; height:96px; border-radius:50%; background:linear-gradient(160deg, var(--gold-500), var(--gold-600)); display:flex; align-items:center; justify-content:center; margin-bottom:36px; box-shadow:0 0 0 1px rgba(201,168,118,0.4), 0 20px 50px -10px rgba(201,168,118,0.5);">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#15110D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>
    </div>

    <h1 style="font-size:40px; color:var(--white); margin-bottom:16px;">Welcome to En Soleil</h1>
    <p style="font-size:15px; color:#C9BDAF; line-height:1.65; margin:0 0 36px;">Your account is ready. We've sent you a welcome email with the app download links.</p>

    <button class="btn-gold" style="width:280px; height:54px; background:var(--gold-500); color:var(--panel-black); border:none; border-radius:12px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; margin-bottom:40px;">Go to my account</button>

    <p style="font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#8A7C6C; margin:0 0 14px;">Download the app</p>
    <div style="display:flex; gap:12px;">
      <span class="app-btn" style="display:inline-flex; align-items:center; gap:10px; padding:10px 18px; border:1px solid #3A322A; border-radius:10px; color:#F1E3D0; font-size:13px; font-weight:600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.7 12.4c0-2.7 2.2-4 2.3-4.1-1.3-1.9-3.2-2.1-3.9-2.2-1.7-.2-3.2 1-4.1 1-.9 0-2.2-1-3.6-1-1.8 0-3.5 1.1-4.5 2.7-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.5 2.7 1.4-.1 1.9-.9 3.6-.9s2.1.9 3.6.9c1.5 0 2.4-1.3 3.3-2.7.7-1 1.2-2 1.5-3.1-3.6-.1-4.1-2.9-4.1-3.2Z"/><path d="M13.9 4.4c.7-.9 1.2-2.1 1.1-3.4-1.1.1-2.4.7-3.2 1.6-.7.8-1.3 2-1.1 3.2 1.3.1 2.5-.6 3.2-1.4Z"/></svg>
        App Store
      </span>
      <span class="app-btn" style="display:inline-flex; align-items:center; gap:10px; padding:10px 18px; border:1px solid #3A322A; border-radius:10px; color:#F1E3D0; font-size:13px; font-weight:600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3.5v17l9-8.5-9-8.5Z"/><path d="m14 12 3.2-2.2 3.3 1.9c.7.4.7 1.4 0 1.8l-3.3 1.9L14 12Z"/><path d="M13.2 11.2 4.6 3.1c.2-.1.5-.1.7 0l10 5.7-2.1 2.4Z"/><path d="M13.2 12.8 4.6 20.9c.2.1.5.1.7 0l10-5.7-2.1-2.4Z"/></svg>
        Google Play
      </span>
    </div>

  </div>

</div>

</x-dc>
</body>
</html>
