<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg-blush-1: #F8EAE1; --bg-blush-2: #FCF4EE;
      --ink-900: #221A14; --ink-700: #55483D; --ink-400: #9C8D80;
      --gold-500: #C9A876; --gold-600: #AD8A5C; --gold-100: #F1E3D0;
      --border: #E7D9C9; --white: #FFFFFF; --panel-black: #15110D;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', sans-serif; color: var(--ink-900); }
    h1, h2, h3 { font-family: 'Bodoni Moda', Georgia, 'Times New Roman', serif; margin: 0; font-weight: 500; }
    a { color: var(--gold-600); text-decoration: none; }
    a:hover { color: var(--ink-900); }
    .btn-outline { transition: all .15s ease; }
    .btn-outline:hover { background: var(--gold-100) !important; }
    .link-back:hover { color: var(--gold-600); }
  </style>
</helmet>

<div style="display:flex; width:1440px; height:900px; background:var(--bg-blush-1); overflow:hidden; font-family:'Manrope',sans-serif;">

  <div style="width:600px; min-width:600px; height:900px; background:radial-gradient(circle at 30% 22%, #2a221a 0%, var(--panel-black) 55%, #0c0a08 100%); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:64px; text-align:center; overflow:hidden;">
    <div style="position:absolute; inset:0; background-image: radial-gradient(rgba(201,168,118,0.16) 1px, transparent 1.5px); background-size: 18px 18px; opacity:0.6;"></div>
    <img src="logo.png" alt="En Soleil" style="width:170px; height:auto; position:relative; z-index:1; margin-bottom:36px;">
    <p style="position:relative; z-index:1; font-family:'Bodoni Moda', serif; font-size:22px; line-height:1.55; color:#F1E3D0; max-width:340px; font-weight:400; letter-spacing:0.2px;">Almost there. Confirm your email to begin.</p>
  </div>

  <div style="flex:1; height:900px; background:linear-gradient(160deg, var(--bg-blush-2) 0%, var(--bg-blush-1) 100%); display:flex; align-items:center; justify-content:center; padding:40px;">
    <div style="width:440px; background:var(--white); border-radius:24px; box-shadow:0 30px 60px -20px rgba(34,26,20,0.18); padding:52px 44px; text-align:center;">

      <div style="width:76px; height:76px; border-radius:50%; background:var(--gold-100); display:flex; align-items:center; justify-content:center; margin:0 auto 28px; position:relative;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--gold-600)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-11Z"/><path d="m4 7 8 6 8-6"/></svg>
        <span style="position:absolute; right:-4px; bottom:-4px; width:26px; height:26px; border-radius:50%; background:var(--gold-500); border:3px solid var(--white); display:flex; align-items:center; justify-content:center;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6l4 2"/><circle cx="12" cy="12" r="9.5"/></svg>
        </span>
      </div>

      <h1 style="font-size:26px; color:var(--ink-900); margin-bottom:12px;">Check your inbox</h1>
      <p style="font-size:14px; color:var(--ink-700); line-height:1.6; margin:0 0 8px;">We sent a verification link to</p>
      <p style="font-size:14px; color:var(--ink-900); font-weight:700; margin:0 0 28px;">alexandra.rivas@email.com</p>

      <button class="btn-outline" style="width:100%; height:52px; background:transparent; color:var(--gold-600); border:1.5px solid var(--gold-500); border-radius:12px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; margin-bottom:24px;">Resend email</button>

      <p style="font-size:12.5px; color:var(--ink-400); line-height:1.6; margin:0 0 20px;">Can't find it? Check your spam or promotions folder.</p>

      <a href="#" class="link-back" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--ink-400);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg>
        Back to log in
      </a>

    </div>
  </div>

</div>

</x-dc>
</body>
</html>
