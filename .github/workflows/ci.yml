name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    # Varias pantallas (/forgot-password, /signup...) instancian el cliente
    # de Supabase durante el prerender estático, aunque nunca llegan a hacer
    # una llamada de red en ese paso — @supabase/ssr solo valida que URL y
    # key no vengan vacíos. Sin Supabase local en este job (no hace falta:
    # el build no ejecuta lógica de negocio), basta un valor no vacío.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-no-se-usa-en-red
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # El hook `send_email` (Story 1.1/1.2, envío real vía Brevo) exige
      # `SEND_EMAIL_HOOK_SECRET` con formato "v1,whsec_<base64>" — el CLI
      # valida config.toml completo en cualquier comando, así que sin él
      # `supabase start` falla con "Invalid hook config: ... secrets must
      # be formatted as v1,whsec_...", incluso antes de correr un test.
      # Y aunque se le diera un valor válido, este runner no tiene
      # `supabase/functions/.env` (gitignored, nunca se sube) con las
      # credenciales reales de Brevo — sin ellas la function fallaría, y
      # Auth corta el flujo entero si el hook falla (no solo el email), así
      # que signUp/resetPasswordForEmail se romperían para cualquier test.
      # Se desactiva el hook solo en esta copia efímera del checkout (nunca
      # se comitea, no toca el config.toml real de local dev/staging/prod):
      # Auth cae de vuelta a su SMTP simulado (Mailpit), que es justo lo que
      # ya esperan los tests de este repo. Ver docs/ci-cd/RESUMEN.md.
      - name: Desactivar el hook de email real (solo en este runner)
        run: |
          awk '
            /^\[auth\.hook\.send_email\]/ { print; print "enabled = false"; skip=1; next }
            /^\[/ { skip=0 }
            skip && /^(enabled|uri|secrets) *=/ { next }
            { print }
          ' supabase/config.toml > supabase/config.toml.tmp
          mv supabase/config.toml.tmp supabase/config.toml

      # `supabase start` aplica supabase/migrations sobre un Postgres
      # efímero en el runner — nunca toca un proyecto remoto. Los tests de
      # este proyecto no mockean Supabase (ver CLAUDE.md §Metodología de
      # test), así que necesitan una instancia real para correr.
      - name: Levantar Supabase local
        run: supabase start

      # `supabase status -o json` da un objeto plano (`API_URL`,
      # `PUBLISHABLE_KEY`, `SECRET_KEY`, con `ANON_KEY`/`SERVICE_ROLE_KEY`
      # como alias legacy) — confirmado contra la versión del CLI que usa
      # este proyecto, ver docs/ci-cd/RESUMEN.md.
      - name: Exportar credenciales del Supabase local
        run: |
          supabase status -o json > /tmp/supabase-status.json

          API_URL="$(jq -r '.API_URL // empty' /tmp/supabase-status.json)"
          PUBLISHABLE_KEY="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY // empty' /tmp/supabase-status.json)"
          SERVICE_ROLE_KEY="$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY // empty' /tmp/supabase-status.json)"

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Story 4.2 — `src/lib/stripe-payments.test.ts` corre contra la
      # sandbox real de Stripe (modo test), igual que en local: necesita
      # las Edge Functions respondiendo de verdad, no solo `supabase start`
      # (que las deja instaladas pero sin servir). `supabase/functions/.env`
      # nunca se comitea (gitignored), así que el runner arma el suyo desde
      # el secret de GitHub — mismo secreto de test que usa el desarrollador
      # en local, sin riesgo real (modo test, sin dinero real). `APP_URL`
      # también hace falta (sin servir nada real — no hay `npm run dev` en
      # este job): `stripe-create-checkout-session` la usa para armar el
      # `return_url` que le manda a Stripe, que rechaza la sesión si no es
      # una URL absoluta válida. El resto de secrets de
      # `supabase/functions/.env` (Brevo, webhooks) no hace falta dárselos
      # aquí: ninguna function que los necesite se invoca en esta suite (el
      # hook de email está desactivado arriba, y el webhook de recibo de
      # reserva es un no-op sin sus secretos de Vault, que este runner
      # tampoco crea — ver CLAUDE.md §Email de recibo de reserva).
      # Epic 9 — `src/lib/membership.test.ts` invoca directamente la Edge
      # Function `membership-renewal` (cobro de la renovación automática) con
      # su secreto compartido, igual que lo haría el cron vía pg_net. En este
      # runner todo es efímero (Supabase en Docker, functions servidas aquí
      # mismo), así que el secreto se genera al vuelo en vez de ser un secret
      # de GitHub: solo tiene que coincidir entre la function y los tests.
      - name: Generar el secreto compartido de membership-renewal (Epic 9)
        run: echo "MEMBERSHIP_RENEWAL_WEBHOOK_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Servir las Edge Functions localmente (Story 4.2 — Stripe)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          {
            echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
            echo "MEMBERSHIP_RENEWAL_WEBHOOK_SECRET=$MEMBERSHIP_RENEWAL_WEBHOOK_SECRET"
            # No sirve nada de verdad en este runner (no hay npm run dev) —
            # stripe-create-checkout-session solo necesita que sea una URL
            # absoluta válida para el `return_url` que le manda a Stripe.
            # Sin esto, `${Deno.env.get("APP_URL")}/...` queda literal
            # "undefined/..." y Stripe rechaza la Checkout Session con 500.
            echo "APP_URL=http://127.0.0.1:3000"
          } > supabase/functions/.env
          nohup supabase functions serve --env-file supabase/functions/.env \
            > /tmp/functions-serve.log 2>&1 &

          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:54331/functions/v1/stripe-payment-methods || echo 000)"
            if [ "$code" != "000" ]; then
              echo "Edge Functions respondiendo (HTTP $code) tras ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "Las Edge Functions nunca respondieron — log de supabase functions serve:"
          cat /tmp/functions-serve.log
          exit 1

      - run: npm test
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
