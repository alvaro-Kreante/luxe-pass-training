name: Deploy

# Excepción acotada a CLAUDE.md §"Supabase Local Development": solo este
# pipeline enlaza proyectos remotos (`supabase link` + `db push`, sin
# `--local`). Ningún desarrollador hace esto a mano en su máquina.
#
# El release a Vercel se dispara desde aquí, después de la migración —
# nunca por el auto-deploy nativo de Vercel al detectar el push (desactivado
# en ambos proyectos vía Ignored Build Step, ver docs/ci-cd/RESUMEN.md).
# Así se garantiza el orden: migración de base de datos primero, código
# nuevo después.

#
# CI-02 (docs/audit/ci-cd-y-entornos.md): el deploy nunca arranca sin el CI
# en verde sobre ese mismo commit. Un push a staging/main lo dispara el fin
# del workflow CI (`workflow_run`), no el push; el lanzamiento manual solo
# vale desde staging/main y comprueba que el CI de ese SHA pasó.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolver rama y commit a desplegar (solo con CI en verde)
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            if [ "$RUN_CONCLUSION" != "success" ] || [ "$RUN_EVENT" != "push" ]; then
              echo "::notice::CI terminó en '$RUN_CONCLUSION' (evento '$RUN_EVENT'): no se despliega."
              exit 0
            fi
            branch="$RUN_BRANCH"; sha="$RUN_SHA"
          else
            branch="$GITHUB_REF_NAME"; sha="$GITHUB_SHA"
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" --jq '.total_count')
            if [ "$green" = "0" ]; then
              echo "::error::El CI no pasó sobre $sha: no se despliega."
              exit 1
            fi
          fi
          if [ "$branch" != "staging" ] && [ "$branch" != "main" ]; then
            echo "::error::Solo se despliega desde staging o main (recibido: $branch)."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  migrate-dev:
    needs: resolve
    if: needs.resolve.outputs.branch == 'staging'
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      # El CLI valida config.toml completo en cualquier comando (no solo en
      # los pasos de la function) — sin esto, hasta `db push` falla con
      # "Invalid hook config: ... secrets must be formatted as v1,whsec_...".
      SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET_DEV }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Enlazar proyecto remoto luxepass-dev
        run: supabase link --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
      - name: Aplicar migraciones pendientes
        run: supabase db push
      - name: Revisar advisors de seguridad/performance
        run: supabase db advisors --linked
        continue-on-error: true
      - name: Configurar secrets de la Edge Function send-email
        run: |
          supabase secrets set \
            BREVO_API_KEY="${{ secrets.BREVO_API_KEY }}" \
            BREVO_SENDER_EMAIL="${{ secrets.BREVO_SENDER_EMAIL }}" \
            BREVO_SENDER_NAME="${{ secrets.BREVO_SENDER_NAME }}" \
            SEND_EMAIL_HOOK_SECRET="${{ secrets.SEND_EMAIL_HOOK_SECRET_DEV }}" \
            APP_URL="${{ secrets.APP_URL_DEV }}" \
            APP_ENV="STAGING"
      - name: Desplegar la Edge Function send-email
        run: supabase functions deploy send-email --no-verify-jwt
      # Story 4.2/5.1 — mismo patrón que send-email arriba. `APP_URL_DEV`
      # se reusa (ya existía para send-email): `stripe-create-checkout-
      # session` arma con ella el `return_url` que le manda a Stripe, que
      # rechaza la Checkout Session si no es una URL pública real.
      # `stripe-webhook` y `send-booking-receipt` van con `--no-verify-jwt`
      # (config.toml ya lo declara así — ninguna de las dos recibe un JWT
      # de usuario: Stripe firma la suya, Postgres no tiene sesión). Las
      # otras tres SÍ verifican JWT por defecto — las llama un miembro
      # autenticado vía `supabase.functions.invoke`.
      # Cuenta Stripe propia por ambiente (no compartida como Brevo) —
      # STRIPE_SECRET_KEY_DEV/_PROD, no un solo STRIPE_SECRET_KEY. El de
      # `ci.yml` (sin sufijo) es aparte: sandbox de solo-test para la
      # suite automatizada, no un ambiente desplegado.
      - name: Configurar secrets de las Edge Functions de Stripe/recibo de reserva
        run: |
          supabase secrets set \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY_DEV }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET_DEV }}" \
            BOOKING_RECEIPT_WEBHOOK_SECRET="${{ secrets.BOOKING_RECEIPT_WEBHOOK_SECRET_DEV }}" \
            APP_URL="${{ secrets.APP_URL_DEV }}"
      - name: Desplegar las Edge Functions de Stripe/recibo de reserva
        run: |
          supabase functions deploy stripe-create-checkout-session
          supabase functions deploy stripe-charge-saved-method
          supabase functions deploy stripe-payment-methods
          supabase functions deploy stripe-cancel-booking
          supabase functions deploy stripe-webhook --no-verify-jwt
          supabase functions deploy send-booking-receipt --no-verify-jwt
      # Story 5.3 — mismo patrón que send-booking-receipt arriba: Postgres
      # llama a esta function vía pg_net (pg_cron, no un insert), sin JWT de
      # usuario, así que verify_jwt va desactivado en config.toml. El
      # secreto compartido debe coincidir con el que se dé de alta en
      # Supabase Vault (`booking_reminder_webhook_secret`) de este mismo
      # proyecto — paso manual, ver CLAUDE.md §Recordatorio de reserva (pg_cron).
      - name: Configurar secret de la Edge Function send-booking-reminder
        run: |
          supabase secrets set \
            BOOKING_REMINDER_WEBHOOK_SECRET="${{ secrets.BOOKING_REMINDER_WEBHOOK_SECRET_DEV }}"
      - name: Desplegar la Edge Function send-booking-reminder
        run: supabase functions deploy send-booking-reminder --no-verify-jwt
      # Story 6.3 — mismo patrón que send-booking-reminder arriba: pg_cron
      # (dispatch_account_deletions, ver supabase/schemas/account_deletion.sql)
      # llama a esta function vía pg_net pasados los 30 días de gracia del
      # borrado de cuenta, sin JWT de usuario. El secreto compartido debe
      # coincidir con el que se dé de alta en Supabase Vault
      # (account_deletion_webhook_secret) de este mismo proyecto — paso
      # manual, ver CLAUDE.md §Borrado de cuenta (pg_cron).
      - name: Configurar secret de la Edge Function delete-account
        run: |
          supabase secrets set \
            ACCOUNT_DELETION_WEBHOOK_SECRET="${{ secrets.ACCOUNT_DELETION_WEBHOOK_SECRET_DEV }}"
      - name: Desplegar la Edge Function delete-account
        run: supabase functions deploy delete-account --no-verify-jwt
      # Epic 10 · Story 10.4 — activar/suspender partners y el acceso de sus
      # usuarios (cuentas de Auth con service role). La llama el admin con
      # su sesión, así que verifica JWT. Usa APP_URL y BREVO_* de este job.
      - name: Desplegar la Edge Function admin-partners
        run: supabase functions deploy admin-partners
      # Epic 9 — membresía y referidos. `stripe-membership-checkout` (alta y
      # subida de plan) la llama un miembro autenticado, así que verifica JWT
      # por defecto y reutiliza STRIPE_SECRET_KEY/APP_URL, ya dados de alta
      # arriba. `membership-renewal` (aviso de renovación + cobro de la
      # renovación automática) la llama el cron `dispatch_membership_renewals`
      # vía pg_net, sin JWT de usuario — mismo patrón que send-booking-reminder.
      # El secreto compartido debe coincidir con el de Supabase Vault
      # (`membership_renewal_webhook_secret`) de este mismo proyecto — paso
      # manual, ver CLAUDE.md §Membresía y referidos reales.
      - name: Configurar secret de la Edge Function membership-renewal
        run: |
          supabase secrets set \
            MEMBERSHIP_RENEWAL_WEBHOOK_SECRET="${{ secrets.MEMBERSHIP_RENEWAL_WEBHOOK_SECRET_DEV }}"
      - name: Desplegar las Edge Functions de membresía (Epic 9)
        run: |
          supabase functions deploy stripe-membership-checkout
          supabase functions deploy membership-renewal --no-verify-jwt
      # CI-03 — las 4 functions que faltaban. `stripe-refund-payment` (reembolso
      # del admin, Story 8.1) verifica JWT y usa STRIPE_SECRET_KEY, ya dado de
      # alta arriba. Las otras tres las llaman Database Webhooks / pg_cron sin
      # JWT de usuario, con un secreto compartido que debe coincidir con el de
      # Supabase Vault (docs/ci-cd/VAULT-SECRETS.md). Si el secreto de GitHub
      # aún no existe, se avisa y no se toca: la function rechaza las llamadas.
      - name: Configurar secrets de notificaciones a partners y reportes del admin
        env:
          PARTNER_NOTIFICATION_WEBHOOK_SECRET: ${{ secrets.PARTNER_NOTIFICATION_WEBHOOK_SECRET_DEV }}
          PARTNER_DIGEST_WEBHOOK_SECRET: ${{ secrets.PARTNER_DIGEST_WEBHOOK_SECRET_DEV }}
          ADMIN_REPORT_WEBHOOK_SECRET: ${{ secrets.ADMIN_REPORT_WEBHOOK_SECRET_DEV }}
        run: |
          for name in PARTNER_NOTIFICATION_WEBHOOK_SECRET PARTNER_DIGEST_WEBHOOK_SECRET ADMIN_REPORT_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then
              supabase secrets set "$name=${!name}"
            else
              echo "::warning::Falta el secret de GitHub ${name}_DEV: la function que lo usa rechazará las llamadas."
            fi
          done
      - name: Desplegar reembolsos, notificaciones a partners y reportes del admin
        run: |
          supabase functions deploy stripe-refund-payment
          supabase functions deploy send-partner-booking-event --no-verify-jwt
          supabase functions deploy send-partner-digest --no-verify-jwt
          supabase functions deploy send-admin-report --no-verify-jwt
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Descargar configuración del proyecto luxepass-dev
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
      - name: Construir el proyecto
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
      - name: Desplegar en Vercel (luxepass-dev)
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}

  migrate-prod:
    needs: resolve
    if: needs.resolve.outputs.branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET_PROD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Enlazar proyecto remoto luxepass-prod
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
      - name: Aplicar migraciones pendientes
        run: supabase db push
      - name: Revisar advisors de seguridad/performance
        run: supabase db advisors --linked
        continue-on-error: true
      - name: Configurar secrets de la Edge Function send-email
        run: |
          supabase secrets set \
            BREVO_API_KEY="${{ secrets.BREVO_API_KEY }}" \
            BREVO_SENDER_EMAIL="${{ secrets.BREVO_SENDER_EMAIL }}" \
            BREVO_SENDER_NAME="${{ secrets.BREVO_SENDER_NAME }}" \
            SEND_EMAIL_HOOK_SECRET="${{ secrets.SEND_EMAIL_HOOK_SECRET_PROD }}" \
            APP_URL="${{ secrets.APP_URL_PROD }}" \
            APP_ENV="PROD"
      - name: Desplegar la Edge Function send-email
        run: supabase functions deploy send-email --no-verify-jwt
      - name: Configurar secrets de las Edge Functions de Stripe/recibo de reserva
        run: |
          supabase secrets set \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY_PROD }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}" \
            BOOKING_RECEIPT_WEBHOOK_SECRET="${{ secrets.BOOKING_RECEIPT_WEBHOOK_SECRET_PROD }}" \
            APP_URL="${{ secrets.APP_URL_PROD }}"
      - name: Desplegar las Edge Functions de Stripe/recibo de reserva
        run: |
          supabase functions deploy stripe-create-checkout-session
          supabase functions deploy stripe-charge-saved-method
          supabase functions deploy stripe-payment-methods
          supabase functions deploy stripe-cancel-booking
          supabase functions deploy stripe-webhook --no-verify-jwt
          supabase functions deploy send-booking-receipt --no-verify-jwt
      - name: Configurar secret de la Edge Function send-booking-reminder
        run: |
          supabase secrets set \
            BOOKING_REMINDER_WEBHOOK_SECRET="${{ secrets.BOOKING_REMINDER_WEBHOOK_SECRET_PROD }}"
      - name: Desplegar la Edge Function send-booking-reminder
        run: supabase functions deploy send-booking-reminder --no-verify-jwt
      - name: Configurar secret de la Edge Function delete-account
        run: |
          supabase secrets set \
            ACCOUNT_DELETION_WEBHOOK_SECRET="${{ secrets.ACCOUNT_DELETION_WEBHOOK_SECRET_PROD }}"
      - name: Desplegar la Edge Function delete-account
        run: supabase functions deploy delete-account --no-verify-jwt
      # Epic 10 · Story 10.4 — activar/suspender partners y el acceso de sus
      # usuarios (cuentas de Auth con service role). La llama el admin con
      # su sesión, así que verifica JWT. Usa APP_URL y BREVO_* de este job.
      - name: Desplegar la Edge Function admin-partners
        run: supabase functions deploy admin-partners
      # Epic 9 — mismo patrón que migrate-dev arriba.
      - name: Configurar secret de la Edge Function membership-renewal
        run: |
          supabase secrets set \
            MEMBERSHIP_RENEWAL_WEBHOOK_SECRET="${{ secrets.MEMBERSHIP_RENEWAL_WEBHOOK_SECRET_PROD }}"
      - name: Desplegar las Edge Functions de membresía (Epic 9)
        run: |
          supabase functions deploy stripe-membership-checkout
          supabase functions deploy membership-renewal --no-verify-jwt
      # CI-03 — las 4 functions que faltaban. `stripe-refund-payment` (reembolso
      # del admin, Story 8.1) verifica JWT y usa STRIPE_SECRET_KEY, ya dado de
      # alta arriba. Las otras tres las llaman Database Webhooks / pg_cron sin
      # JWT de usuario, con un secreto compartido que debe coincidir con el de
      # Supabase Vault (docs/ci-cd/VAULT-SECRETS.md). Si el secreto de GitHub
      # aún no existe, se avisa y no se toca: la function rechaza las llamadas.
      - name: Configurar secrets de notificaciones a partners y reportes del admin
        env:
          PARTNER_NOTIFICATION_WEBHOOK_SECRET: ${{ secrets.PARTNER_NOTIFICATION_WEBHOOK_SECRET_PROD }}
          PARTNER_DIGEST_WEBHOOK_SECRET: ${{ secrets.PARTNER_DIGEST_WEBHOOK_SECRET_PROD }}
          ADMIN_REPORT_WEBHOOK_SECRET: ${{ secrets.ADMIN_REPORT_WEBHOOK_SECRET_PROD }}
        run: |
          for name in PARTNER_NOTIFICATION_WEBHOOK_SECRET PARTNER_DIGEST_WEBHOOK_SECRET ADMIN_REPORT_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then
              supabase secrets set "$name=${!name}"
            else
              echo "::warning::Falta el secret de GitHub ${name}_PROD: la function que lo usa rechazará las llamadas."
            fi
          done
      - name: Desplegar reembolsos, notificaciones a partners y reportes del admin
        run: |
          supabase functions deploy stripe-refund-payment
          supabase functions deploy send-partner-booking-event --no-verify-jwt
          supabase functions deploy send-partner-digest --no-verify-jwt
          supabase functions deploy send-admin-report --no-verify-jwt
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Descargar configuración del proyecto luxepass-prod
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
      - name: Construir el proyecto
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
      - name: Desplegar en Vercel (luxepass-prod)
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
      # CI-05 — cada release a producción queda marcado con un tag, el punto
      # al que volver según docs/ci-cd/ROLLBACK.md.
      - name: Etiquetar el release
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          tag="release-$(date -u +%Y%m%d-%H%M)"
          git tag "$tag" "$SHA"
          git push origin "$tag"
