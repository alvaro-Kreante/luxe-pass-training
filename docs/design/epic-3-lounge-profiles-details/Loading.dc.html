<!doctype html>
<html>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg-blush-1: #F8EAE1; --bg-blush-2: #FCF4EE;
      --ink-900: #221A14; --ink-700: #55483D; --ink-400: #9C8D80;
      --gold-500: #C9A876; --gold-600: #AD8A5C; --gold-100: #F1E3D0;
      --border: #E7D9C9; --white: #FFFFFF; --panel-black: #15110D;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', sans-serif; color: var(--ink-900); }
    h1, h2, h3 { font-family: 'Bodoni Moda', Georgia, 'Times New Roman', serif; margin: 0; font-weight: 500; }
    a { color: var(--gold-600); text-decoration: none; }
    a:hover { color: var(--ink-900); }
    .amn { width: 17px; height: 17px; fill: none; stroke: var(--gold-600); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item { transition: background .15s ease; }
    .nav-item:hover { background: var(--gold-100); }
    .btn-gold { transition: background .15s ease; }
    .btn-gold:hover { background: var(--gold-600) !important; }
    .btn-outline { transition: background .15s ease, border-color .15s ease; }
    .btn-outline:hover { background: var(--gold-100); }
    .carousel-arrow { transition: background .15s ease; }
    .carousel-arrow:hover { background: var(--white); }
    .slot { transition: border-color .15s ease, background .15s ease; }
    .slot:hover { border-color: var(--gold-500); }
    .cal-cell { height: 104px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; transition: border-color .15s ease; }
    .cal-cell:hover { border-color: var(--gold-500); }
    .cell-ok { background: var(--gold-100); border: 1px solid transparent; }
    .cell-low { background: var(--white); border: 1.5px solid var(--gold-500); }
    .cell-full { background: var(--white); border: 1px solid var(--border); }
    .cell-closed { background: var(--bg-blush-1); border: 1px dashed var(--border); }
    .cell-past { background: var(--bg-blush-1); border: 1px solid transparent; }
    .cv { font-size: 15px; font-weight: 700; color: var(--ink-900); }
    .cl { font-size: 11px; color: var(--ink-700); }
    .cd { font-size: 12.5px; font-weight: 700; color: var(--ink-400); }
    .panel-scroll { overflow-y: auto; }
    .panel-scroll::-webkit-scrollbar { width: 6px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    @keyframes shimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
    .skeleton { background: linear-gradient(90deg, #F1E7DD 0%, #F8F1EA 50%, #F1E7DD 100%); background-size: 420px 100%; animation: shimmer 1.4s linear infinite; border-radius: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
  </style>
</helmet>
