<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg-blush-1: #F8EAE1; --bg-blush-2: #FCF4EE;
      --ink-900: #221A14; --ink-700: #55483D; --ink-400: #9C8D80;
      --gold-500: #C9A876; --gold-600: #AD8A5C; --gold-100: #F1E3D0;
      --border: #E7D9C9; --white: #FFFFFF; --panel-black: #15110D;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', sans-serif; color: var(--ink-900); }
    h1, h2, h3 { font-family: 'Bodoni Moda', Georgia, 'Times New Roman', serif; margin: 0; font-weight: 500; }
    a { color: var(--gold-600); text-decoration: none; }
    a:hover { color: var(--ink-900); }
    .btn-gold { transition: background .15s ease; }
    .btn-gold:hover { background: var(--gold-600) !important; }
    .input-field { transition: border-color .15s ease, box-shadow .15s ease; }
    .input-field:focus { outline: none; border-color: var(--gold-500) !important; box-shadow: 0 0 0 3px rgba(201,168,118,0.15); }
    .link-back:hover { color: var(--gold-600); }
  </style>
</helmet>

<div style="display:flex; width:1440px; height:900px; background:var(--bg-blush-1); overflow:hidden; font-family:'Manrope',sans-serif;">

  <div style="width:600px; min-width:600px; height:900px; background:radial-gradient(circle at 30% 22%, #2a221a 0%, var(--panel-black) 55%, #0c0a08 100%); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:64px; text-align:center; overflow:hidden;">
    <div style="position:absolute; inset:0; background-image: radial-gradient(rgba(201,168,118,0.16) 1px, transparent 1.5px); background-size: 18px 18px; opacity:0.6;"></div>
    <img src="logo.png" alt="En Soleil" style="width:170px; height:auto; position:relative; z-index:1; margin-bottom:36px;">
    <p style="position:relative; z-index:1; font-family:'Bodoni Moda', serif; font-size:22px; line-height:1.55; color:#F1E3D0; max-width:340px; font-weight:400; letter-spacing:0.2px;">Every journey has a detour worth taking.</p>
  </div>

  <div style="flex:1; height:900px; background:linear-gradient(160deg, var(--bg-blush-2) 0%, var(--bg-blush-1) 100%); display:flex; align-items:center; justify-content:center; padding:40px;">
    <div style="width:440px; background:var(--white); border-radius:24px; box-shadow:0 30px 60px -20px rgba(34,26,20,0.18); padding:48px 44px; text-align:center;">

      <p style="font-size:12px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-600); margin:0 0 14px;">Error 404</p>

      <h1 style="font-size:28px; color:var(--ink-900); margin-bottom:8px;">This page has moved on</h1>
      <p style="font-size:14px; color:var(--ink-700); margin:0 0 32px; line-height:1.55;">The link may be outdated or the address mistyped. Let us take you somewhere more comfortable.</p>

      <button class="btn-gold" style="width:100%; height:52px; background:var(--gold-500); color:var(--white); border:none; border-radius:12px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer;">Back to home</button>

      <p style="text-align:center; font-size:13px; color:var(--ink-700); margin:22px 0 0;">Not a member yet? <a href="#" style="font-weight:700;">Join LuxePass</a></p>

    </div>
  </div>

</div>

</x-dc>
</body>
</html>
