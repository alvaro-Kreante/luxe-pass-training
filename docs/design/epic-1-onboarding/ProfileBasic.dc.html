<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg-blush-1: #F8EAE1; --bg-blush-2: #FCF4EE;
      --ink-900: #221A14; --ink-700: #55483D; --ink-400: #9C8D80;
      --gold-500: #C9A876; --gold-600: #AD8A5C; --gold-100: #F1E3D0;
      --border: #E7D9C9; --white: #FFFFFF; --panel-black: #15110D;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', sans-serif; color: var(--ink-900); }
    h1, h2, h3 { font-family: 'Bodoni Moda', Georgia, 'Times New Roman', serif; margin: 0; font-weight: 500; }
    a { color: var(--gold-600); text-decoration: none; }
    a:hover { color: var(--ink-900); }
    .btn-gold { transition: background .15s ease; }
    .btn-gold:hover { background: var(--gold-600) !important; }
    .input-field { transition: border-color .15s ease, box-shadow .15s ease; }
    .input-field:focus { outline: none; border-color: var(--gold-500) !important; box-shadow: 0 0 0 3px rgba(201,168,118,0.15); }
    .upload-circle:hover { border-color: var(--gold-500) !important; }
  </style>
</helmet>

<div style="display:flex; width:1440px; height:900px; background:var(--bg-blush-1); overflow:hidden; font-family:'Manrope',sans-serif;">

  <div style="width:600px; min-width:600px; height:900px; background:radial-gradient(circle at 30% 22%, #2a221a 0%, var(--panel-black) 55%, #0c0a08 100%); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:64px; text-align:center; overflow:hidden;">
    <div style="position:absolute; inset:0; background-image: radial-gradient(rgba(201,168,118,0.16) 1px, transparent 1.5px); background-size: 18px 18px; opacity:0.6;"></div>
    <img src="logo.png" alt="En Soleil" style="width:170px; height:auto; position:relative; z-index:1; margin-bottom:36px;">
    <p style="position:relative; z-index:1; font-family:'Bodoni Moda', serif; font-size:22px; line-height:1.55; color:#F1E3D0; max-width:340px; font-weight:400; letter-spacing:0.2px;">Tell us who you are.</p>
  </div>

  <div style="flex:1; height:900px; background:linear-gradient(160deg, var(--bg-blush-2) 0%, var(--bg-blush-1) 100%); display:flex; align-items:center; justify-content:center; padding:40px;">
    <div style="width:460px; background:var(--white); border-radius:24px; box-shadow:0 30px 60px -20px rgba(34,26,20,0.18); padding:44px 44px 40px;">

      <div style="display:flex; align-items:center; gap:8px; margin-bottom:24px;">
        <div style="flex:1; height:4px; border-radius:2px; background:var(--gold-500);"></div>
        <div style="flex:1; height:4px; border-radius:2px; background:var(--border);"></div>
        <div style="flex:1; height:4px; border-radius:2px; background:var(--border);"></div>
      </div>
      <p style="font-size:12px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold-600); margin:0 0 6px;">Step 1 of 3 · Basics</p>

      <h1 style="font-size:27px; color:var(--ink-900); margin-bottom:8px;">A bit about you</h1>
      <p style="font-size:14px; color:var(--ink-700); margin:0 0 26px; line-height:1.5;">Basic information for your member profile.</p>

      <div style="display:flex; align-items:center; gap:16px; margin-bottom:26px;">
        <div class="upload-circle" style="width:72px; height:72px; min-width:72px; border-radius:50%; border:1.5px dashed var(--border); display:flex; align-items:center; justify-content:center; color:var(--ink-400);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.5"/></svg>
        </div>
        <div>
          <a href="#" style="font-size:13px; font-weight:700;">Upload profile photo</a>
          <p style="font-size:12px; color:var(--ink-400); margin:4px 0 0;">JPG or PNG, 5MB max</p>
        </div>
      </div>

      <label style="display:block; font-size:13px; font-weight:600; color:var(--ink-700); margin-bottom:8px;">Full name *</label>
      <div style="position:relative; margin-bottom:18px;">
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ink-400); display:flex;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        </span>
        <input type="text" placeholder="Alexandra Rivas" class="input-field" style="width:100%; height:50px; padding:0 16px 0 46px; border:1px solid var(--border); border-radius:12px; font-size:14px; font-family:'Manrope',sans-serif;">
      </div>

      <label style="display:block; font-size:13px; font-weight:600; color:var(--ink-700); margin-bottom:8px;">Phone number *</label>
      <div style="position:relative; margin-bottom:18px;">
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ink-400); display:flex;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h3l1.5 4.5-2 1.5a11 11 0 0 0 5 5l1.5-2 4.5 1.5v3a2 2 0 0 1-2 2C10.5 20.5 3.5 13.5 3.5 5a2 2 0 0 1 2-2Z"/></svg>
        </span>
        <input type="tel" placeholder="+1 (555) 000-0000" class="input-field" style="width:100%; height:50px; padding:0 16px 0 46px; border:1px solid var(--border); border-radius:12px; font-size:14px; font-family:'Manrope',sans-serif;">
      </div>

      <label style="display:block; font-size:13px; font-weight:600; color:var(--ink-700); margin-bottom:8px;">Date of birth (day / month)</label>
      <div style="display:flex; gap:12px; margin-bottom:30px;">
        <select class="input-field" style="flex:1; height:50px; padding:0 16px; border:1px solid var(--border); border-radius:12px; font-size:14px; font-family:'Manrope',sans-serif; color:var(--ink-900); background:var(--white);">
          <option>Day</option>
        </select>
        <select class="input-field" style="flex:1; height:50px; padding:0 16px; border:1px solid var(--border); border-radius:12px; font-size:14px; font-family:'Manrope',sans-serif; color:var(--ink-900); background:var(--white);">
          <option>Month</option>
        </select>
      </div>

      <button class="btn-gold" style="width:100%; height:52px; background:var(--gold-500); color:var(--white); border:none; border-radius:12px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer;">Continue</button>

    </div>
  </div>

</div>

</x-dc>
</body>
</html>
