<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg-blush-1: #F8EAE1;
      --bg-blush-2: #FCF4EE;
      --ink-900: #221A14;
      --ink-700: #55483D;
      --ink-400: #9C8D80;
      --gold-500: #C9A876;
      --gold-600: #AD8A5C;
      --gold-100: #F1E3D0;
      --border: #E7D9C9;
      --white: #FFFFFF;
      --panel-black: #15110D;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', sans-serif; color: var(--ink-900); }
    h1, h2, h3 { font-family: 'Bodoni Moda', Georgia, 'Times New Roman', serif; margin: 0; font-weight: 500; }
    a { color: var(--gold-600); text-decoration: none; }
    a:hover { color: var(--ink-900); }
    .btn-gold { transition: background .15s ease; }
    .btn-gold:hover { background: var(--gold-600) !important; }
    .input-field { transition: border-color .15s ease, box-shadow .15s ease; }
    .input-field:focus { outline: none; border-color: var(--gold-500) !important; box-shadow: 0 0 0 3px rgba(201,168,118,0.15); }
    .link-back:hover { color: var(--gold-600); }
    .checkbox-box { transition: border-color .15s ease; }
    label:hover .checkbox-box { border-color: var(--gold-500); }
  </style>
</helmet>

<div style="display:flex; width:1440px; height:900px; background:var(--bg-blush-1); overflow:hidden; font-family:'Manrope',sans-serif;">

  <!-- Left panel -->
  <div style="width:600px; min-width:600px; height:900px; background:radial-gradient(circle at 30% 22%, #2a221a 0%, var(--panel-black) 55%, #0c0a08 100%); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:64px; text-align:center; overflow:hidden;">
    <div style="position:absolute; inset:0; background-image: radial-gradient(rgba(201,168,118,0.16) 1px, transparent 1.5px); background-size: 18px 18px; opacity:0.6;"></div>
    <img src="logo.png" alt="En Soleil" style="width:170px; height:auto; position:relative; z-index:1; margin-bottom:36px;">
    <p style="position:relative; z-index:1; font-family:'Bodoni Moda', serif; font-size:22px; line-height:1.55; color:#F1E3D0; max-width:340px; font-weight:400; letter-spacing:0.2px;">Join a community of discerning travelers.</p>
  </div>

  <!-- Right panel -->
  <div style="flex:1; height:900px; background:linear-gradient(160deg, var(--bg-blush-2) 0%, var(--bg-blush-1) 100%); display:flex; align-items:center; justify-content:center; padding:40px;">
    <div style="width:440px; background:var(--white); border-radius:24px; box-shadow:0 30px 60px -20px rgba(34,26,20,0.18); padding:44px 44px 40px;">

      <a href="#" class="link-back" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--ink-400); margin-bottom:22px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg>
        Back to log in
      </a>

      <h1 style="font-size:30px; color:var(--ink-900); margin-bottom:8px;">Create account</h1>
      <p style="font-size:14px; color:var(--ink-700); margin:0 0 28px; line-height:1.5;">Join our exclusive community of members.</p>

      <label style="display:block; font-size:13px; font-weight:600; color:var(--ink-700); margin-bottom:8px;">Email address</label>
      <div style="position:relative; margin-bottom:18px;">
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ink-400); display:flex;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-11Z"/><path d="m4 7 8 6 8-6"/></svg>
        </span>
        <input type="email" placeholder="you@email.com" class="input-field" style="width:100%; height:50px; padding:0 16px 0 46px; border:1px solid var(--border); border-radius:12px; font-size:14px; font-family:'Manrope',sans-serif; color:var(--ink-900); background:var(--white);">
      </div>

      <label style="display:block; font-size:13px; font-weight:600; color:var(--ink-700); margin-bottom:8px;">Password</label>
      <div style="position:relative; margin-bottom:6px;">
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ink-400); display:flex;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <input type="password" placeholder="At least 8 characters, 1 special" class="input-field" style="width:100%; height:50px; padding:0 46px; border:1px solid var(--border); border-radius:12px; font-size:14px; font-family:'Manrope',sans-serif;">
        <span style="position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--ink-400); display:flex;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
        </span>
      </div>
      <p style="font-size:12px; color:var(--ink-400); margin:0 0 18px;">8+ characters, including one special character.</p>

      <label style="display:block; font-size:13px; font-weight:600; color:var(--ink-700); margin-bottom:8px;">Confirm password</label>
      <div style="position:relative; margin-bottom:22px;">
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ink-400); display:flex;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <input type="password" placeholder="Re-enter your password" class="input-field" style="width:100%; height:50px; padding:0 16px 0 46px; border:1px solid var(--border); border-radius:12px; font-size:14px; font-family:'Manrope',sans-serif;">
      </div>

      <label style="display:flex; align-items:flex-start; gap:10px; margin-bottom:26px; cursor:pointer;">
        <span class="checkbox-box" style="width:18px; height:18px; min-width:18px; border-radius:5px; border:1.5px solid var(--border); background:var(--white); display:block; margin-top:1px;"></span>
        <span style="font-size:13px; color:var(--ink-700); line-height:1.5;">I have read and agree to the <a href="#" style="font-weight:700;">Terms of Service</a> and <a href="#" style="font-weight:700;">Privacy Policy</a></span>
      </label>

      <button class="btn-gold" style="width:100%; height:52px; background:var(--gold-500); color:var(--white); border:none; border-radius:12px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; opacity:0.5;">Create account</button>
      <p style="text-align:center; font-size:12px; color:var(--ink-400); margin:10px 0 0;">Disabled until the terms are accepted.</p>

      <p style="text-align:center; font-size:13px; color:var(--ink-700); margin:18px 0 0;">Already have an account? <a href="#" style="font-weight:700;">Log in</a></p>

    </div>
  </div>

</div>

</x-dc>
</body>
</html>
